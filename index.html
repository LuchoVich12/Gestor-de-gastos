<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Gastos Personales</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    </head>
    <body>
    <header>
        <h1>Gestor de Gastos</h1>
        <div class="resumen">
        <h2>Saldo Total: $<span id="saldo-total">0</span></h2>
        </div>
    </header>

    <main>
        <!-- Formulario para agregar movimientos -->
        <section class="formulario-seccion">
        <h3>Agregar Movimiento</h3>
        <form id="form-movimiento">
        <input
            type="text"
            id="concepto"
            placeholder="Ej. Supermercado"
            required
        />
        <input
            type="number"
            id="monto"
            placeholder="Monto"
            min="1"
            step="any"
            required
        />

        <select id="tipo">
            <option value="gasto">Gasto</option>
            <option value="ingreso">Ingreso</option>
        </select>

        <select id="categoria" required>
            <option value="" disabled selected>Cargando categorías...</option>
        </select>

        <button type="submit">Guardar</button>
        </form>
    </section>

    <!-- Filtros y Lista de movimientos -->
    <section class="historial-seccion">
        <h3>Historial</h3>
        <div class="filtros">
        <button id="btn-todos">Todos</button>
        <button id="btn-ingresos">Solo Ingresos</button>
        <button id="btn-gastos">Solo Gastos</button>
        </div>

        <ul id="lista-movimientos">
        <!-- Los elementos se renderizan dinámicamente con JS -->
        </ul>
    </section>
    <section class="grafico-seccion">
        <h3>Distribución de Gastos</h3>
        <div style="position: relative; max-width: 350px; margin: 0 auto;">
        <canvas id="grafico-gastos"></canvas>
    </div>
</section>
    </main>
    
    
    <!-- SweetAlert2 y Toastify JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/main.js"></script>

</body>
</html>
